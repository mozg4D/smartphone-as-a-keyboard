name: Build Android APK
on:
  push:
    branches: [android-immersive]
    paths:
      - "android-project.zip"
      - ".github/workflows/build-immersive-apk.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Extract project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q android-project.zip -d extracted
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build debug APK
        working-directory: extracted/android
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: smartphone-keyboard-debug-apk
          path: extracted/android/app/build/outputs/apk/debug/app-debug.apk
