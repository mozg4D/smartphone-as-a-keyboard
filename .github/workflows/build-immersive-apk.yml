name: Build Android APK
on:
  push:
    branches: [android-immersive]
    paths:
      - "android-project.zip"
      - "android-v2.patch"
      - "android-v4.patch"
      - ".github/workflows/build-immersive-apk.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Extract project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q android-project.zip -d extracted
      - name: Apply HID foreground-service fix
        run: patch -p1 -d extracted < android-v2.patch
      - name: Apply haptics and launcher icon
        run: patch -p1 -d extracted < android-v4.patch
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build debug APK
        working-directory: extracted/android
        run: gradle :app:assembleDebug --stacktrace
      - name: Build unsigned release APK
        working-directory: extracted/android
        run: gradle :app:assembleRelease --stacktrace
      - name: Collect release signing tools
        run: |
          mkdir -p release-tools
          cp extracted/android/app/build/outputs/apk/release/app-release-unsigned.apk release-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" release-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" release-tools/
      - uses: actions/upload-artifact@v4
        with:
          name: smartphone-keyboard-release-input-v4
          path: release-tools/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: smartphone-keyboard-debug-apk-v4
          path: extracted/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
